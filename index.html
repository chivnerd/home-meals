<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Meals</title>
<!-- v3.1 -->
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#faf6ef;color:#3a322a;line-height:1.5;margin:0;padding:0 0 48px}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  .topbar{position:sticky;top:0;background:#faf6ef;border-bottom:1px solid #eadfd2;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;z-index:10}
  .topbar a.brand{font-family:Georgia,"Times New Roman",serif;font-size:20px;color:#3a322a;text-decoration:none;font-weight:bold}
  .cartbtn{background:#c96f4a;color:#fffdf8;border:none;border-radius:999px;padding:8px 14px;font-size:14px;text-decoration:none;display:inline-block}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:28px;margin:24px 0 2px}
  .sub{color:#8a7d6d;font-size:14px;margin:0 0 8px}
  .card{background:#fffdf8;border:1px solid #eadfd2;border-radius:16px;padding:18px;margin-top:16px}
  a.cardlink{text-decoration:none;color:inherit;display:block}
  h2{font-family:Georgia,"Times New Roman",serif;font-size:20px;margin:0 0 4px}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#8a7d6d;margin:18px 0 8px}
  .meta{color:#8a7d6d;font-size:14px}
  .tag{display:inline-block;background:#f3e0d5;color:#c96f4a;border-radius:999px;padding:2px 10px;font-size:12px;margin:6px 6px 0 0}
  .hh{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;margin:6px 6px 0 0}
  .ok{background:#e6efe4;color:#5d8a5a}
  .no{background:#f3e0d5;color:#c96f4a}
  .macros{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .macro{background:#faf6ef;border:1px solid #eadfd2;border-radius:10px;padding:8px 12px;text-align:center;min-width:64px}
  .macro b{display:block;font-size:15px}
  .macro span{font-size:11px;color:#8a7d6d}
  ul,ol{margin:0;padding-left:20px}
  li{margin:6px 0}
  .opt{color:#8a7d6d;font-size:13px}
  .note{background:#e6efe4;color:#5d8a5a;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:16px}
  .note textarea{width:100%;border:none;background:transparent;color:inherit;font:inherit;resize:vertical;min-height:44px}
  .btn{display:inline-block;border-radius:12px;padding:10px 14px;font-size:15px;border:1px solid #eadfd2;background:#fffdf8;color:#3a322a;text-decoration:none;margin:8px 8px 0 0;cursor:pointer}
  .btn.primary{background:#c96f4a;border-color:#c96f4a;color:#fffdf8}
  .btn.inlist{background:#e6efe4;border-color:#cfe0cc;color:#5d8a5a}
  .back{color:#c96f4a;text-decoration:none;font-size:14px;display:inline-block;margin-top:18px}
  .shopitem{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0e7db}
  .shopitem:last-child{border-bottom:none}
  .shopitem input{margin-top:4px;width:20px;height:20px;accent-color:#5d8a5a;flex-shrink:0}
  .shopitem label{flex:1;font-size:15px}
  .shopitem.done label{text-decoration:line-through;color:#b3a797}
  .shopgroup{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#8a7d6d;margin:16px 0 4px;display:flex;justify-content:space-between;align-items:center}
  .shopgroup button{background:none;border:none;color:#c96f4a;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0}
  .empty{color:#8a7d6d;text-align:center;padding:32px 0}
  .importcard{background:#c96f4a;border-radius:16px;padding:18px;margin-top:16px;color:#fffdf8;text-align:center}
  .importcard .btn{display:block;width:100%;background:#fffdf8;color:#c96f4a;border:none;font-weight:bold;font-size:16px;padding:14px;margin:0;border-radius:12px}
  .importcard .helper{font-size:13px;margin:10px 0 0;opacity:.92}
  .cookitem{display:flex;align-items:flex-start;gap:14px;padding:16px 12px;border-bottom:1px solid #f0e7db;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .cookitem:last-child{border-bottom:none}
  .cookitem input{margin-top:3px;width:26px;height:26px;accent-color:#5d8a5a;flex-shrink:0;pointer-events:none}
  .cookitem .stepnum{font-family:Georgia,"Times New Roman",serif;font-weight:bold;color:#c96f4a;min-width:24px;font-size:18px}
  .cookitem .steptext{flex:1;font-size:17px;line-height:1.55}
  .cookitem.done .steptext,.cookitem.done .stepnum{text-decoration:line-through;color:#b3a797}
  .cookitem .steplistbtn{flex-shrink:0;min-width:58px;min-height:44px;align-self:center;background:#fffdf8;border:1px solid #eadfd2;border-radius:10px;color:#c96f4a;font-weight:bold;font-size:14px;font-family:inherit;cursor:pointer;margin-left:2px}
  .shopitem .delbtn{margin-left:auto;background:none;border:none;color:#c96f4a;font-size:22px;min-width:44px;min-height:40px;padding:0 6px;cursor:pointer;line-height:1;align-self:center}
  .customadd{display:flex;gap:8px;margin-top:14px}
  .customadd input{flex:1;font:inherit;font-size:15px;padding:12px;border:1px solid #eadfd2;border-radius:10px;background:#fff;min-height:46px}
  .customadd .btn{margin:0;min-height:46px;padding:10px 18px}
  .scaler{display:inline-flex;border:1px solid #eadfd2;border-radius:999px;overflow:hidden;margin-left:8px;vertical-align:middle}
  .scaler button{border:none;background:#fffdf8;padding:6px 14px;font-size:14px;color:#3a322a;cursor:pointer}
  .scaler button.on{background:#c96f4a;color:#fffdf8;font-weight:bold}
  .ingedit{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid #eadfd2;border-radius:8px;margin:4px 0;background:#fff}
  .tweakbanner{background:#fdf3e3;border:1px solid #f0dcb8;color:#a4762a;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .tweakbanner a{color:#a4762a}
  .edited{color:#a4762a;font-size:12px}
  .comment{border-top:1px solid #f0e7db;padding:10px 0;font-size:15px}
  .comment .who{font-weight:bold;font-size:13px;color:#8a7d6d}
  .comment .actions{float:right}
  .comment .actions button,.comment .actions a{background:none;border:none;color:#c96f4a;font-size:12px;cursor:pointer;text-decoration:none;margin-left:8px}
  .rateperson{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0e7db}
  .rateperson:last-child{border-bottom:none}
  .rateperson .pname{font-size:15px}
  .stars button{background:none;border:none;font-size:26px;color:#d8cbb8;cursor:pointer;padding:2px 3px;line-height:1}
  .stars button.lit{color:#e8a33d}
  .avgchip{display:inline-block;background:#fdf3e3;color:#a4762a;border-radius:999px;padding:2px 10px;font-size:12px;margin:6px 6px 0 0}
  .commentform input{display:block;width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #eadfd2;border-radius:10px;margin:8px 0;background:#fff}
  .syncstatus{text-align:center;color:#8a7d6d;font-size:12px;margin:20px 0 4px}
  .syncstatus.ok{color:#5d8a5a}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a322a;color:#faf6ef;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="#/">Home Meals</a>
  <a class="cartbtn" href="#/list" id="cartBtn">Shopping list</a>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
// ===== Data =====
var HOUSEHOLD=[
  {name:'Corey',needs:[]},
  {name:'Erin',needs:['gluten-free','dairy-free','nightshade-free']},
  {name:'Camille',needs:['gluten-free']},
  {name:'Farrah',needs:['gluten-free']},
  {name:'Quentin',needs:[]}
];
var RECIPES=[
  {
    id:'teriyaki-beef-broccoli-noodles',
    name:'Teriyaki Beef + Broccoli Noodles',
    serves:5,
    time:'~30 min',
    tags:['gluten-free','dairy-free','nightshade-free'],
    ingredients:[
      {qty:2,unit:'lb',text:'ground sirloin'},
      {qty:1,unit:'box',plural:'boxes',text:'Jovial GF brown-rice spaghetti'},
      {qty:1,unit:'',text:'broccoli crown, cut into florets'},
      {qty:1,unit:'',text:'yellow onion, sliced'},
      {qty:4,unit:'cloves',text:'garlic, minced'},
      {text:'Thumb of ginger, grated'},
      {qty:4,unit:'tbsp',text:'tamari'},
      {qty:3,unit:'tbsp',text:'coconut aminos'},
      {qty:3,unit:'tbsp',text:'maple syrup'},
      {text:'Black pepper, white pepper, and salt'},
      {text:'Star anise or a cinnamon stick',optional:true},
      {text:'Toasted sesame oil',optional:true},
      {text:'Sesame seeds',optional:true},
      {text:'Scallions, sliced',optional:true}
    ],
    steps:[
      'Salt the pasta water and cook the GF spaghetti just shy of done. Reserve a cup of pasta water before draining.',
      'Drop the broccoli florets into the pasta water for the last 2-3 minutes, or steam them separately.',
      'High heat, a little oil. Brown the beef with black pepper, white pepper, and salt, breaking it up well. Drain excess fat.',
      'Push the beef aside, drop to medium heat. Onion in, 3-4 minutes, then garlic and grated ginger for 1 minute.',
      'Add the sauce: tamari, coconut aminos, and maple syrup (simmer in the star anise or cinnamon stick if using). Scrape the pan and let it bubble 1-2 minutes.',
      'Toss in the pasta and broccoli. Loosen with pasta water as needed and adjust salt and sweetness to taste.',
      'Finish with toasted sesame oil, sesame seeds, and scallions. No chili flakes in the pan (nightshade allergy) - heat goes on at the table.'
    ],
    macros:{cal:'~650',protein:'44g',carbs:'68g',fat:'18g'},
    note:'Wife-safe: celiac gluten-free, dairy-free, and nightshade-free.'
  }
];
var IMPORT_NUMBER='+16504447686';
var IMPORT_PREFIX='Recipe import (extract the recipe from this link and email it to inboxkznzjv@agent.instinct.co with subject "Recipe import"): ';

// ===== State =====
var LS_KEY='hm-shopping-v1';
function loadState(){
  try{var s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.recipes&&s.checked)return s;}catch(e){}
  return {recipes:[],checked:{}};
}
function saveState(s){localStorage.setItem(LS_KEY,JSON.stringify(s));cloudPush();}
var state=loadState();

var LS_COOK='hm-cooking-v1';
function loadCook(){
  try{var s=JSON.parse(localStorage.getItem(LS_COOK));if(s&&typeof s==='object')return s;}catch(e){}
  return {};
}
function saveCook(){localStorage.setItem(LS_COOK,JSON.stringify(cookState));}
var cookState=loadCook();

var LS_ADJ='hm-adjust-v1';
function loadAdj(){
  try{var s=JSON.parse(localStorage.getItem(LS_ADJ));if(s&&typeof s==='object')return s;}catch(e){}
  return {};
}
function saveAdj(){localStorage.setItem(LS_ADJ,JSON.stringify(adjState));}
var adjState=loadAdj();
function getAdj(rid){if(!adjState[rid])adjState[rid]={scale:1,edits:{},note:null};return adjState[rid];}
function hasAdj(rid){var a=adjState[rid];return !!(a&&(a.scale!==1||Object.keys(a.edits||{}).length||(a.note!=null&&a.note!=='')));}

var LS_COMMENTS='hm-comments-v1';
function loadComments(){
  try{var s=JSON.parse(localStorage.getItem(LS_COMMENTS));if(s&&typeof s==='object')return s;}catch(e){}
  return {};
}
function saveComments(){localStorage.setItem(LS_COMMENTS,JSON.stringify(commentState));cloudPush();}
var commentState=loadComments();

var LS_RATINGS='hm-ratings-v1';
function loadRatings(){
  try{var s=JSON.parse(localStorage.getItem(LS_RATINGS));if(s&&typeof s==='object')return s;}catch(e){}
  return {};
}
function saveRatings(){localStorage.setItem(LS_RATINGS,JSON.stringify(ratingsState));cloudPush();}
var ratingsState=loadRatings();
function getAvg(rid){
  var r=ratingsState[rid];if(!r)return null;
  var vals=Object.keys(r).map(function(k){return r[k];}).filter(function(v){return v>0;});
  if(!vals.length)return null;
  return Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10;
}

var editMode=null; // recipe id currently in edit mode (not persisted)

// ===== Helpers =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}
function getRecipe(id){for(var i=0;i<RECIPES.length;i++)if(RECIPES[i].id===id)return RECIPES[i];return null;}
function worksFor(r,p){for(var i=0;i<p.needs.length;i++)if(r.tags.indexOf(p.needs[i])<0)return false;return true;}
function householdRow(r){
  return HOUSEHOLD.map(function(p){
    var ok=worksFor(r,p);
    return '<span class="hh '+(ok?'ok':'no')+'">'+(ok?'&#10003; ':'&#10005; ')+esc(p.name)+'</span>';
  }).join('');
}
function tagRow(r){return r.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');}
function macroRow(r){
  return '<div class="macros">'+
    '<div class="macro"><b>'+esc(r.macros.cal)+'</b><span>cal</span></div>'+
    '<div class="macro"><b>'+esc(r.macros.protein)+'</b><span>protein</span></div>'+
    '<div class="macro"><b>'+esc(r.macros.carbs)+'</b><span>carbs</span></div>'+
    '<div class="macro"><b>'+esc(r.macros.fat)+'</b><span>fat</span></div></div>';
}
function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2200);
}
function updateCartBadge(){
  var n=state.recipes.length;
  document.getElementById('cartBtn').textContent='Shopping list'+(n?' ('+n+')':'');
}
function isMobile(){return /iPad|iPhone|iPod|Android/i.test(navigator.userAgent);}
function smsHref(number,body){
  var sep=/iPad|iPhone|iPod/.test(navigator.userAgent)?'&':'?';
  return 'sms:'+number+sep+'body='+encodeURIComponent(body);
}
function copyText(txt,okMsg){
  function fallback(){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast(okMsg);}catch(e){toast('Copy failed');}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(okMsg);},fallback);
  }else{fallback();}
}
function formatQty(q){
  var whole=Math.floor(q+1e-9),frac=q-whole,out='';
  var fr={0.25:'\u00BC',0.5:'\u00BD',0.75:'\u00BE'};
  var key=Math.round(frac*100)/100;
  if(fr[key]){out=(whole>0?whole:'')+fr[key];}
  else{out=String(Math.round(q*100)/100);}
  return out;
}
function ingText(ing,scale){
  if(ing.qty==null)return ing.text;
  var q=ing.qty*(scale||1);
  var unit=ing.unit||'';
  if(unit&&q!==1&&ing.plural)unit=ing.plural;
  return formatQty(q)+(unit?' '+unit:'')+' '+ing.text;
}
function dispIng(r,idx){
  var a=getAdj(r.id);
  if(a.edits&&a.edits[idx]!=null)return a.edits[idx];
  return ingText(r.ingredients[idx],a.scale||1);
}

// ===== Send recipe as text =====
function recipeText(r){
  var a=getAdj(r.id);
  var lines=[];
  lines.push(r.name);
  lines.push('Serves '+r.serves+' · '+r.time+' | '+r.tags.join(', ')+(a.scale&&a.scale!==1?' (scaled '+a.scale+'x)':''));
  lines.push('');
  lines.push('INGREDIENTS');
  r.ingredients.forEach(function(ing,i){lines.push('- '+dispIng(r,i)+(ing.optional?' (optional)':''));});
  lines.push('');
  lines.push('STEPS');
  r.steps.forEach(function(s,i){lines.push((i+1)+'. '+s);});
  lines.push('');
  lines.push('Macros per serving: '+r.macros.cal+' cal, '+r.macros.protein+' protein, '+r.macros.carbs+' carbs, '+r.macros.fat+' fat');
  var note=a.note!=null&&a.note!==''?a.note:r.note;
  if(note){lines.push('Note: '+note);}
  return lines.join('\n');
}
function sendRecipe(id){
  var r=getRecipe(id);if(!r)return;
  if(isMobile()){window.location.href=smsHref('',recipeText(r));}
  else{copyText(recipeText(r),'Recipe copied - paste it anywhere');}
}
function copyRecipe(id){
  var r=getRecipe(id);if(!r)return;
  copyText(recipeText(r),'Recipe copied');
}

// ===== Adjustments (scaler + edits) =====
function setScale(rid,scale){
  getAdj(rid).scale=scale;saveAdj();render(true);
}
function toggleEditMode(rid){
  editMode=editMode===rid?null:rid;render(true);
}
function saveIngEdit(rid,idx,val){
  var a=getAdj(rid);
  val=val.trim();
  if(val===''||val===ingText(getRecipe(rid).ingredients[idx],a.scale||1)){delete a.edits[idx];}
  else{a.edits[idx]=val;}
  saveAdj();render(true);toast('Tweak saved');
}
function saveNoteEdit(rid,val){
  getAdj(rid).note=val.trim();saveAdj();toast('Note saved');
}
function resetAdj(rid){
  delete adjState[rid];saveAdj();render(true);toast('Back to the master recipe');
}
function sendTweak(rid){
  var r=getRecipe(rid);var a=getAdj(rid);
  var lines=['Tweak for '+r.name+':'];
  if(a.scale&&a.scale!==1)lines.push('Scale: '+a.scale+'x');
  Object.keys(a.edits||{}).forEach(function(idx){
    lines.push('- '+ingText(r.ingredients[idx],a.scale||1)+' -> '+a.edits[idx]);
  });
  if(a.note!=null&&a.note!==''&&a.note!==r.note)lines.push('Note -> '+a.note);
  var body=lines.join('\n');
  if(isMobile()){window.location.href=smsHref(IMPORT_NUMBER,body);}
  else{copyText(body,'Tweak copied - text it to +1 (650) 444-7686');}
}

// ===== Ratings =====
function setRating(rid,person,n){
  if(!ratingsState[rid])ratingsState[rid]={};
  if(ratingsState[rid][person]===n){delete ratingsState[rid][person];}
  else{ratingsState[rid][person]=n;}
  saveRatings();render(true);
}
function sendRatings(rid){
  var r=getRecipe(rid);var rt=ratingsState[rid]||{};
  var parts=HOUSEHOLD.filter(function(p){return rt[p.name];}).map(function(p){return p.name+' \u2605'+rt[p.name];});
  var body='Home Meals verdicts ('+r.name+'): '+parts.join(', ')+' - avg '+getAvg(rid);
  if(isMobile()){window.location.href=smsHref(IMPORT_NUMBER,body);}
  else{copyText(body,'Verdicts copied - text them to +1 (650) 444-7686');}
}

// ===== Comments =====
function addComment(rid){
  var nameEl=document.getElementById('cm-name'),textEl=document.getElementById('cm-text');
  var text=textEl.value.trim();if(!text){toast('Write something first');return;}
  var name=nameEl.value.trim()||'Anonymous';
  if(!commentState[rid])commentState[rid]=[];
  commentState[rid].push({name:name,text:text,ts:Date.now()});
  saveComments();render(true);toast('Note added');
}
function delComment(rid,idx){
  if(!commentState[rid])return;
  commentState[rid].splice(idx,1);saveComments();render(true);
}
function sendComment(rid,idx){
  var r=getRecipe(rid);var c=commentState[rid][idx];
  var body='Home Meals note ('+r.name+') - '+c.name+': '+c.text;
  if(isMobile()){window.location.href=smsHref(IMPORT_NUMBER,body);}
  else{copyText(body,'Note copied - text it to +1 (650) 444-7686');}
}

// ===== Custom shopping items =====
var LS_CUSTOM='hm-custom-v1';
function loadCustom(){try{var s=JSON.parse(localStorage.getItem(LS_CUSTOM));if(s&&s.length)return s;}catch(e){}return [];}
function saveCustom(){localStorage.setItem(LS_CUSTOM,JSON.stringify(customState));cloudPush();}
var customState=loadCustom();
function addCustomItem(text){
  text=(text||'').replace(/\s+/g,' ').trim();
  if(!text){toast('Type an item first');return false;}
  customState.push({id:'c'+Date.now()+'_'+Math.floor(Math.random()*100000),text:text,done:false});
  saveCustom();return true;
}
function addCustomFromInput(){
  var el=document.getElementById('custom-add');if(!el)return;
  if(addCustomItem(el.value)){el.value='';render(true);toast('Added to list');}
}
function addStepToList(rid,idx){
  var r=getRecipe(rid);if(!r)return;
  if(addCustomItem(r.steps[idx])){render(true);toast('Step added to shopping list');}
}
function toggleCustom(id){
  customState.forEach(function(c){if(c.id===id)c.done=!c.done;});
  saveCustom();render(true);
}
function delCustom(id){
  customState=customState.filter(function(c){return c.id!==id;});
  saveCustom();render(true);
}
function clearCustom(){customState=[];saveCustom();render(true);}

// ===== Shopping actions =====
function toggleShop(id){
  var i=state.recipes.indexOf(id);
  if(i>=0){state.recipes.splice(i,1);}
  else{state.recipes.push(id);toast('Added to shopping list');}
  saveState(state);updateCartBadge();render(true);
}
function removeFromShop(id){
  var i=state.recipes.indexOf(id);if(i>=0)state.recipes.splice(i,1);
  Object.keys(state.checked).forEach(function(k){if(k.indexOf(id+':')===0)delete state.checked[k];});
  saveState(state);updateCartBadge();render(true);
}
function toggleItem(key){
  if(state.checked[key])delete state.checked[key];else state.checked[key]=true;
  saveState(state);render(true);
}
function uncheckAll(){state.checked={};customState.forEach(function(c){c.done=false;});saveCustom();saveState(state);render(true);}
function clearShop(){state={recipes:[],checked:{}};customState=[];saveCustom();saveState(state);updateCartBadge();render(true);}

// ===== Cooking actions =====
function isStepDone(rid,idx){return !!(cookState[rid]&&cookState[rid][idx]);}
function toggleStep(rid,idx){
  if(!cookState[rid])cookState[rid]={};
  if(cookState[rid][idx])delete cookState[rid][idx];else cookState[rid][idx]=true;
  saveCook();render(true);
}
function resetSteps(rid){
  delete cookState[rid];saveCook();render(true);toast('Steps reset - enjoy dinner');
}

// ===== Views =====
function viewList(){
  var h='<h1>Home Meals</h1><p class="sub">The family recipe book. '+RECIPES.length+' recipe'+(RECIPES.length===1?'':'s')+' and counting.</p>';
  h+='<div class="importcard">'+
    '<a class="btn" href="'+smsHref(IMPORT_NUMBER,IMPORT_PREFIX)+'">Text it to Instinct</a>'+
    '<p class="helper">Send a blog link - the recipe lands here, minus the life story.</p></div>';
  RECIPES.forEach(function(r){
    h+='<a class="cardlink" href="#/recipe/'+r.id+'"><div class="card">'+
      '<h2>'+esc(r.name)+'</h2>'+
      '<div class="meta">Serves '+esc(r.serves)+' &middot; '+esc(r.time)+'</div>'+
      '<div>'+tagRow(r)+'</div>'+
      '<div>'+householdRow(r)+'</div>'+
      (getAvg(r.id)?'<div><span class="avgchip">&#9733; '+getAvg(r.id)+'</span></div>':'')+
      '</div></a>';
  });
  h+='<p class="syncstatus" id="syncstatus"></p>';
  return h;
}
function viewRecipe(id){
  var r=getRecipe(id);
  if(!r)return '<a class="back" href="#/">&larr; All recipes</a><div class="empty">Recipe not found.</div>';
  var inList=state.recipes.indexOf(r.id)>=0;
  var a=getAdj(r.id);
  var scale=a.scale||1;
  var editing=editMode===r.id;
  var note=a.note!=null&&a.note!==''?a.note:r.note;

  var h='<a class="back" href="#/">&larr; All recipes</a><div class="card">'+
    '<h2>'+esc(r.name)+'</h2>'+
    '<div class="meta">Serves '+esc(r.serves)+' &middot; '+esc(r.time)+'</div>'+
    '<div>'+tagRow(r)+'</div>'+
    '<div>'+householdRow(r)+'</div>'+
    macroRow(r)+
    '<div style="margin-top:14px">'+
      '<button class="btn primary" onclick="sendRecipe(\''+r.id+'\')">Send as text</button>'+
      '<button class="btn" onclick="copyRecipe(\''+r.id+'\')">Copy</button>'+
      '<button class="btn '+(inList?'inlist':'')+'" onclick="toggleShop(\''+r.id+'\')">'+(inList?'&#10003; On shopping list':'+ Shopping list')+'</button>'+
      '<button class="btn" onclick="toggleEditMode(\''+r.id+'\')">'+(editing?'Done editing':'Edit')+'</button>'+
    '</div>';

  // Ingredients header + scaler
  h+='<h3>Ingredients <span class="scaler">'+
    [1,1.5,2].map(function(s){return '<button class="'+(scale===s?'on':'')+'" onclick="setScale(\''+r.id+'\','+s+')">'+s+'x</button>';}).join('')+
    '</span></h3>';

  if(hasAdj(r.id)){
    h+='<div class="tweakbanner">Your tweaks, on this phone only - the master recipe is unchanged. '+
      '<a href="javascript:resetAdj(\''+r.id+'\')">Reset</a></div>'+
      '<div><button class="btn primary" onclick="sendTweak(\''+r.id+'\')">Send this tweak</button></div>';
  }

  h+='<ul style="list-style:none;padding-left:0">';
  r.ingredients.forEach(function(ing,idx){
    var edited=a.edits&&a.edits[idx]!=null;
    if(editing){
      h+='<li><input class="ingedit" value="'+escAttr(dispIng(r,idx))+'" onchange="saveIngEdit(\''+r.id+'\','+idx+',this.value)"></li>';
    }else{
      h+='<li>&bull; '+esc(dispIng(r,idx))+(ing.optional?' <span class="opt">(optional)</span>':'')+(edited?' <span class="edited">(edited)</span>':'')+'</li>';
    }
  });
  h+='</ul>';

  // Steps (cooking mode)
  h+='<h3>Steps</h3><div class="cooklist">'+
    r.steps.map(function(st,idx){
      var done=isStepDone(r.id,idx);
      return '<div class="cookitem'+(done?' done':'')+'" onclick="toggleStep(\''+r.id+'\','+idx+')">'+
        '<input type="checkbox" '+(done?'checked':'')+' tabindex="-1">'+
        '<span class="stepnum">'+(idx+1)+'</span>'+
        '<span class="steptext">'+esc(st)+'</span>'+
        '<button class="steplistbtn" onclick="event.stopPropagation();addStepToList(\''+r.id+'\','+idx+')">+ list</button></div>';
    }).join('')+
    '</div>'+
    '<div style="margin-top:12px"><button class="btn" onclick="resetSteps(\''+r.id+'\')">Reset all steps</button></div>';

  // Note
  if(editing){
    h+='<div class="note"><textarea onchange="saveNoteEdit(\''+r.id+'\',this.value)">'+esc(note||'')+'</textarea></div>';
  }else if(note){
    h+='<div class="note">'+esc(note)+'</div>';
  }

  // Ratings
  var rt=ratingsState[r.id]||{};
  var avg=getAvg(r.id);
  h+='<h3>Family verdicts</h3>';
  HOUSEHOLD.forEach(function(p){
    var cur=rt[p.name]||0;
    h+='<div class="rateperson"><span class="pname">'+esc(p.name)+'</span><span class="stars">'+
      [1,2,3,4,5].map(function(n){return '<button class="'+(n<=cur?'lit':'')+'" onclick="setRating(\''+r.id+'\',\''+p.name+'\','+n+')">&#9733;</button>';}).join('')+
      '</span></div>';
  });
  if(avg){h+='<div style="margin-top:10px"><span class="avgchip">&#9733; '+avg+' household average</span></div><div><button class="btn" onclick="sendRatings(\''+r.id+'\')">Text in verdicts</button></div>';}

  // Comments
  var comments=commentState[r.id]||[];
  h+='<h3>Family notes</h3>';
  if(!comments.length){h+='<p class="sub">Nothing yet - first win, substitution, or kid verdict goes here.</p>';}
  comments.forEach(function(c,idx){
    h+='<div class="comment"><span class="actions"><a href="javascript:sendComment(\''+r.id+'\','+idx+')">text in</a><button onclick="delComment(\''+r.id+'\','+idx+')">&times;</button></span><span class="who">'+esc(c.name)+'</span><br>'+esc(c.text)+'</div>';
  });
  h+='<div class="commentform"><input id="cm-name" placeholder="Name (optional)" maxlength="30"><input id="cm-text" placeholder="Add a note - the kids loved it, used 5 tbsp tamari..." maxlength="500"><button class="btn" onclick="addComment(\''+r.id+'\')">Add note</button></div>';

  h+='</div>';
  return h;
}
function viewShopping(){
  var h='<a class="back" href="#/">&larr; All recipes</a><h1>Shopping list</h1>';
  var totalChecked=0,totalItems=0;
  state.recipes.forEach(function(rid){
    var r=getRecipe(rid);if(!r)return;
    var a=getAdj(rid);
    h+='<div class="card"><div class="shopgroup"><span>'+esc(r.name)+'</span><button onclick="removeFromShop(\''+r.id+'\')">remove</button></div>';
    r.ingredients.forEach(function(ing,idx){
      var key=rid+':'+idx;var done=!!state.checked[key];totalItems++;if(done)totalChecked++;
      h+='<div class="shopitem'+(done?' done':'')+'"><input type="checkbox" id="cb-'+key+'" '+(done?'checked':'')+' onchange="toggleItem(\''+key+'\')"><label for="cb-'+key+'">'+esc(dispIng(r,idx))+(ing.optional?' <span class="opt">(optional)</span>':'')+'</label></div>';
    });
    h+='</div>';
  });
  if(!state.recipes.length&&!customState.length){
    h+='<p class="sub" style="text-align:center;margin:24px 8px 0">Nothing from recipes yet - open a recipe and tap "+ Shopping list", or add your own below.</p>';
  }
  h+='<div class="card"><div class="shopgroup"><span>Custom</span>'+(customState.length?'<button onclick="clearCustom()">clear</button>':'')+'</div>';
  customState.forEach(function(c){
    totalItems++;if(c.done)totalChecked++;
    h+='<div class="shopitem'+(c.done?' done':'')+'"><input type="checkbox" id="cb-'+c.id+'" '+(c.done?'checked':'')+' onchange="toggleCustom(\''+c.id+'\')"><label for="cb-'+c.id+'">'+esc(c.text)+'</label><button class="delbtn" onclick="delCustom(\''+c.id+'\')">&times;</button></div>';
  });
  h+='<div class="customadd"><input id="custom-add" placeholder="Add an item - olive oil, candles..." maxlength="120" onkeydown="if(event.key===\'Enter\')addCustomFromInput()"><button class="btn" onclick="addCustomFromInput()">Add</button></div></div>';
  h+='<div style="margin-top:16px"><button class="btn" onclick="uncheckAll()">Uncheck all ('+totalChecked+'/'+totalItems+')</button><button class="btn" onclick="clearShop()">Clear list</button></div>';
  return h;
}

// ===== Household sync (Supabase) =====
var SUPA_URL='https://jyqnxhpzbgifixkhluvj.supabase.co';
var SUPA_KEY='sb_publishable_y3eGmE7RpMFvFLxu3Syh_w_-AlBvJiB';
var HH_KEY=(location.search.match(/[?&]h=([a-z0-9-]+)/i)||[])[1]||null;
if(!HH_KEY){try{HH_KEY=localStorage.getItem('hm-household');}catch(e){}}
if(HH_KEY){try{localStorage.setItem('hm-household',HH_KEY);}catch(e){}}
var lastSync=0,pushTimer=null,syncOnline=false;
function cloudHeaders(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
function setSyncUI(){
  var el=document.getElementById('syncstatus');if(!el)return;
  if(!HH_KEY){el.textContent='';el.className='syncstatus';return;}
  el.textContent=syncOnline?('Synced across the family - '+HH_KEY):'Sync offline - changes stay on this phone';
  el.className='syncstatus'+(syncOnline?' ok':'');
}
function cloudPush(){
  if(!HH_KEY||cloudPush.off)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    var blob={ratings:ratingsState,comments:commentState,shop:state,custom:customState};
    var now=new Date().toISOString();
    fetch(SUPA_URL+'/rest/v1/household_state',{method:'POST',headers:Object.assign(cloudHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify({slug:HH_KEY,state:blob,updated_at:now})})
    .then(function(r){if(r.ok){lastSync=Date.parse(now);syncOnline=true;}else{syncOnline=false;}setSyncUI();})
    .catch(function(){syncOnline=false;setSyncUI();});
  },400);
}
function cloudPull(seedIfEmpty){
  if(!HH_KEY)return;
  fetch(SUPA_URL+'/rest/v1/household_state?slug=eq.'+encodeURIComponent(HH_KEY)+'&select=state,updated_at',{headers:cloudHeaders()})
  .then(function(r){return r.ok?r.json():[];})
  .then(function(rows){
    syncOnline=true;
    if(!rows||!rows.length){if(seedIfEmpty)cloudPush();setSyncUI();return;}
    var row=rows[0];var t=Date.parse(row.updated_at)||0;
    if(t>lastSync){
      lastSync=t;var b=row.state||{};
      cloudPush.off=true;
      try{
        if(b.ratings){ratingsState=b.ratings;localStorage.setItem(LS_RATINGS,JSON.stringify(ratingsState));}
        if(b.comments){commentState=b.comments;localStorage.setItem(LS_COMMENTS,JSON.stringify(commentState));}
        if(b.shop){state=b.shop;localStorage.setItem(LS_KEY,JSON.stringify(state));updateCartBadge();}
        if(b.custom){customState=b.custom;localStorage.setItem(LS_CUSTOM,JSON.stringify(customState));}
      }finally{cloudPush.off=false;}
      render(true);
    }
    setSyncUI();
  })
  .catch(function(){syncOnline=false;setSyncUI();});
}
setInterval(function(){if(!document.hidden)cloudPull(false);},4000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)cloudPull(false);});

// ===== Router =====
function render(keepScroll){
  var y=keepScroll?(window.scrollY||window.pageYOffset||0):0;
  var hash=location.hash||'#/';
  var app=document.getElementById('app');
  if(hash.indexOf('#/recipe/')===0){app.innerHTML=viewRecipe(hash.slice(9));}
  else if(hash==='#/list'){app.innerHTML=viewShopping();}
  else{app.innerHTML=viewList();}
  if(keepScroll){
    window.scrollTo(0,y);
    requestAnimationFrame(function(){window.scrollTo(0,y);});
    setTimeout(function(){window.scrollTo(0,y);},80);
  }
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
updateCartBadge();
render();
cloudPull(true);
setSyncUI();
</script>
