function parseIngLine(line){
  line=(line||'').replace(/\s+/g,' ').trim();
  var optional=false;
  if(/\(optional\)\s*$/i.test(line)){optional=true;line=line.replace(/\(optional\)\s*$/i,'').trim();}
  if(!line)return null;
  var p=parseIngText(line);
  var ing={text:p.name};
  if(p.qty!=null){ing.qty=p.qty;ing.unit=p.unit||'';}
  if(optional)ing.optional=true;
  return ing;
}

}

function nutMatch(name){
  var n=normName(name);
  if(!n)return null;
  if(!nutMatch.sorted){
    nutMatch.sorted=[];
    NUTRI.forEach(function(e){e.k.forEach(function(kw){nutMatch.sorted.push({kw:normName(kw),e:e});});});
    nutMatch.sorted.sort(function(a,b){return b.kw.length-a.kw.length;});
  }
  for(var i=0;i<nutMatch.sorted.length;i++){
    var kw=nutMatch.sorted[i].kw;
    var idx=n.indexOf(kw);
    while(idx>=0){
      var before=idx===0||n.charAt(idx-1)===' ';
      var end=idx+kw.length;
      var after=end===n.length||n.charAt(end)===' '||(n.charAt(end)==='s'&&(end+1===n.length||n.charAt(end+1)===' '));
      if(before&&after)return nutMatch.sorted[i].e;
      idx=n.indexOf(kw,idx+1);
    }
  }
  return null;
}
function nutGrams(qty,unit,e){
  if(qty==null)return e.each||0;
  var u=unitKey(unit);
  if(u==='g')return qty;
  if(u==='kg')return qty*1000;
  if(u==='oz')return qty*28.35;
  if(u==='lb')return qty*453.6;
  if(u==='ml')return qty;
  if(u==='l')return qty*1000;
  if(u==='cup')return qty*(e.cup||200);
  if(u==='tbsp')return qty*(e.tbsp||13);
  if(u==='tsp')return qty*(e.tsp||4.5);
  return qty*(e.each||0);
}
function estMacros(ings,serves){
  var s=parseInt(serves,10);
  if(!(s>0))return null;
  var tot={cal:0,p:0,c:0,f:0},missed=[],matched=0;
  ings.forEach(function(ing){
    var e=nutMatch(ing.text);
    if(!e){missed.push(ing.text.split(',')[0]);return;}
    var g=nutGrams(ing.qty==null?null:ing.qty,ing.unit||'',e);
    if(g<=0){if(e.cal>50)missed.push(ing.text.split(',')[0]);return;}
    matched++;
    tot.cal+=e.cal*g/100;tot.p+=e.p*g/100;tot.c+=e.c*g/100;tot.f+=e.f*g/100;
  });
  if(!matched)return null;
  return {cal:Math.round(tot.cal/s/5)*5,p:Math.round(tot.p/s),c:Math.round(tot.c/s),f:Math.round(tot.f/s),missed:missed};
}
function fillMacroEstimates(){
  var ingEl=document.getElementById('add-ings');
  var ings=(ingEl.value||'').split('\n').map(parseIngLine).filter(Boolean);
  if(!ings.length){toast('Add ingredients first');return;}
  var serves=(document.getElementById('add-serves').value||'');
  if(!(parseInt(serves,10)>0)){toast('Fill in Serves first - macros are per serving');return;}
  var est=estMacros(ings,serves);
  if(!est){toast('Could not match those ingredients - type macros in yourself');return;}
  document.getElementById('add-cal').value='~'+est.cal;
  document.getElementById('add-protein').value=est.p+'g';
  document.getElementById('add-carbs').value=est.c+'g';
  document.getElementById('add-fat').value=est.f+'g';
  window._addMacrosEstimated=true;
  toast('Filled with per-serving estimates - edit anything'+(est.missed.length?'; skipped: '+est.missed.slice(0,3).join(', '):''));
}

var addDraft=null,addBusy=false,addOpen=false;
function isoToMin(s){
  var m=/PT(?:(\d+)H)?(?:(\d+)M)?/i.exec(s||'');if(!m)return '';
  var mins=(+m[1]||0)*60+(+m[2]||0);if(!mins)return '';
  if(mins>=60){var h=Math.floor(mins/60),r=mins%60;return '~'+h+' hr'+(r?' '+r+' min':'');}
  return '~'+mins+' min';
}
function findRecipeNode(o){
  if(!o||typeof o!=='object')return null;
  var t=o['@type'];
  if(t&&(t==='Recipe'||(Array.isArray(t)&&t.indexOf('Recipe')>=0)))return o;
  var keys=['@graph','mainEntity','itemListElement'],i,f;
  for(var k=0;k<keys.length;k++){
    var v=o[keys[k]];
    if(Array.isArray(v)){for(i=0;i<v.length;i++){f=findRecipeNode(v[i]);if(f)return f;}}
    else if(v&&typeof v==='object'){f=findRecipeNode(v);if(f)return f;}
  }
  if(Array.isArray(o)){for(i=0;i<o.length;i++){f=findRecipeNode(o[i]);if(f)return f;}}
  return null;
}
function extractRecipe(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var scripts=doc.querySelectorAll('script[type="application/ld+json"]');
  var node=null;
  for(var i=0;i<scripts.length;i++){
    try{node=findRecipeNode(JSON.parse(scripts[i].textContent));}catch(e){}
    if(node)break;
  }
  if(!node){
    var h1=doc.querySelector('h1');
    return {name:h1?h1.textContent.trim():'',serves:'',time:'',ingredients:[],steps:[]};
  }
  var serves='';
  var ry=node.recipeYield;if(Array.isArray(ry))ry=ry[0];
  if(ry!=null){var sm=String(ry).match(/\d+/);serves=sm?sm[0]:String(ry);}
  var time=isoToMin(node.totalTime)||'';
  if(!time&&node.prepTime&&node.cookTime){
    var pm=/PT(?:(\d+)H)?(?:(\d+)M)?/i.exec(node.prepTime),cm=/PT(?:(\d+)H)?(?:(\d+)M)?/i.exec(node.cookTime);
    var tot=0;
    if(pm)tot+=(+pm[1]||0)*60+(+pm[2]||0);
    if(cm)tot+=(+cm[1]||0)*60+(+cm[2]||0);
    if(tot)time=isoToMin('PT'+tot+'M');
  }
  var ings=node.recipeIngredient||node.ingredients||[];
  if(!Array.isArray(ings))ings=[ings];
  ings=ings.map(function(x){return String(x).trim();}).filter(Boolean);
  var inst=node.recipeInstructions||[];
  if(typeof inst==='string')inst=inst.split(/\n+/);
  if(!Array.isArray(inst))inst=[inst];
  var steps=[];
  inst.forEach(function(x){
    if(x==null)return;
    if(typeof x==='string'||typeof x==='number'){var s=String(x).trim();if(s)steps.push(s);}
    else if(x.itemListElement){x.itemListElement.forEach(function(y){
      if(typeof y==='string'){if(y.trim())steps.push(y.trim());}
      else if(y&&y.text){String(y.text).split(/\n+/).forEach(function(s){if(s.trim())steps.push(s.trim());});}
      else if(y&&y.name){steps.push(String(y.name).trim());}
    });}
    else if(x.text){String(x.text).split(/\n+/).forEach(function(s){if(s.trim())steps.push(s.trim());});}
    else if(x.name){steps.push(String(x.name).trim());}
  });
  return {name:String(node.name||'').trim(),serves:serves,time:time,ingredients:ings,steps:steps};
}
function openAdd(){addOpen=true;render(true);}
function grabLink(){
  var el=document.getElementById('add-url');
  var url=(el.value||'').trim();
  if(!/^https?:\/\//i.test(url)){toast('Paste the full link, starting with http');return;}
  if(addBusy)return;
  addBusy=true;toast('Grabbing the recipe...');
  fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url))
  .then(function(r){if(!r.ok)throw new Error('bad');return r.text();})
  .then(function(html){
    addBusy=false;
    var d=extractRecipe(html);d.source=url;
    addDraft=d;
    if(d.ingredients.length&&d.steps.length){toast('Recipe pulled - check it, tag it, save');}
    else{toast('Got the name only - fill in the rest below');}
    render(true);
  })
  .catch(function(){
    addBusy=false;
    addDraft={name:'',serves:'',time:'',ingredients:[],steps:[],source:url};
    toast('Could not pull that page - type it in below');
    render(true);
  });
}
function saveNewRecipe(){
  function gv(id){var el=document.getElementById(id);return el?el.value.trim():'';}
  var name=gv('add-name');
  if(!name){toast('Give it a name first');return;}
  var ings=gv('add-ings').split('\n').map(parseIngLine).filter(Boolean);
  if(!ings.length){toast('Add at least one ingredient');return;}
  var steps=gv('add-steps').split('\n').map(function(l){return l.replace(/^\d+[\.)]\s*/,'').trim();}).filter(Boolean);
  if(!steps.length){toast('Add at least one step');return;}
  var tags=[];
  ['gluten-free','dairy-free','nightshade-free'].forEach(function(t){
    var cb=document.getElementById('tag-'+t);if(cb&&cb.checked)tags.push(t);
  });
  parseTagsInput(gv('add-tags')).forEach(function(t){if(tags.indexOf(t)<0)tags.push(t);});
  var r={id:uniqueId(slugify(name)),name:name,serves:gv('add-serves'),time:gv('add-time'),tags:tags,
    ingredients:ings,steps:steps,note:gv('add-note')};
  var source=gv('add-source');if(source)r.source=source;
  var cal=gv('add-cal'),protein=gv('add-protein'),carbs=gv('add-carbs'),fat=gv('add-fat');
  var estNote='';
  if(cal||protein||carbs||fat){
    r.macros={cal:cal||'-',protein:protein||'-',carbs:carbs||'-',fat:fat||'-'};
    if(window._addMacrosEstimated){r.macros.est=true;window._addMacrosEstimated=false;}
  }else{
    var est=estMacros(ings,r.serves);
    if(est){
      r.macros={cal:'~'+est.cal,protein:est.p+'g',carbs:est.c+'g',fat:est.f+'g',est:true};
      estNote=' - macros estimated'+(est.missed.length?' ('+est.missed.length+' ingredient'+(est.missed.length===1?'':'s')+' skipped)':'');
    }
  }
  toast('Saving...');
  pullRecipesOnce().then(function(){
    if(getRecipe(r.id))r.id=uniqueId(r.id);
    recipesState.push(r);
    addDraft=null;addOpen=false;
    saveRecipes();
    location.hash='#/recipe/'+r.id;
    toast('Added to the family book'+estNote);
  });
}
function deleteRecipe(rid){
  var r=getRecipe(rid);if(!r)return;
  if(!confirm('Remove "'+r.name+'" from the family book? This removes it for everyone.'))return;
  pullRecipesOnce().then(function(){
    recipesState=recipesState.filter(function(x){return x.id!==rid;});
    saveRecipes();
    location.hash='#/';
    toast('Recipe removed');
  });
}

var LS_KEY='hm-shopping-v1';
function loadState(){
  try{
    var s=JSON.parse(localStorage.getItem(LS_KEY));
    if(s&&s.recipes&&s.checked){
      var migrated={},dirty=false;
      Object.keys(s.checked).forEach(function(k){
        var m=k.match(/^([a-z0-9-]+):(\d+)$/);
        if(m){
          var r=getRecipe(m[1]);
          if(r&&r.ingredients[+m[2]]){migrated['row:'+normName(r.ingredients[+m[2]].text)]=true;dirty=true;return;}
        }
        migrated[k]=s.checked[k];
      });
      if(dirty){s.checked=migrated;localStorage.setItem(LS_KEY,JSON.stringify(s));}
      return s;
    }
  }catch(e){}
  return {recipes:[],checked:{}};
}

function tagSuggest(el){
  var box=el.parentNode.querySelector('.tagsuggest');if(!box)return;
  var v=el.value,i=v.lastIndexOf(',');
  var frag=v.slice(i+1).trim().toLowerCase();
  if(!frag){box.style.display='none';return;}
  var entered=v.toLowerCase().split(',').map(function(s){return s.trim();});
  var m=allTags().filter(function(t){return t.indexOf(frag)===0&&entered.indexOf(t)<0;}).slice(0,6);
  if(!m.length){box.style.display='none';return;}
  box.innerHTML=m.map(function(t){return '<button type="button" data-tag="'+escAttr(t)+'" onmousedown="pickTag(event)">'+esc(t)+'</button>';}).join('');
  box.style.display='block';
}
function pickTag(e){
  e.preventDefault();
  var btn=e.currentTarget,box=btn.parentNode,el=box.parentNode.querySelector('input');
  var v=el.value,i=v.lastIndexOf(',');
  el.value=(i>=0?v.slice(0,i+1)+' ':'')+btn.getAttribute('data-tag')+', ';
  box.style.display='none';

function formatQty(q){
  var whole=Math.floor(q+1e-9),frac=q-whole,out='';
  var fr={0.125:'\u215B',0.25:'\u00BC',0.375:'\u215C',0.5:'\u00BD',0.625:'\u215D',0.75:'\u00BE',0.875:'\u215E'};
  var key=Math.round(frac*8)/8;
  if(key>=1){whole+=1;key=0;}
  if(key>0&&fr[key]&&Math.abs(frac-key)<0.02){out=(whole>0?whole:'')+fr[key];}
  else{out=String(Math.round(q*100)/100);}
  return out;
}
function formatScale(s){
  var fr={0.25:'\u00BC',0.5:'\u00BD',0.75:'\u00BE'};
  var whole=Math.floor(s+1e-9),key=Math.round((s-whole)*100)/100;
  if(fr[key])return (whole>0?whole:'')+fr[key];
  return String(Math.round(s*100)/100);
}
function ingText(ing,scale){
  if(ing.qty==null)return ing.text;
  var q=ing.qty*(scale||1);
  var unit=ing.unit||'';

  return formatQty(q)+(unit?' '+unit:'')+' '+ing.text;
}

var MATCH_STOP={brown:1,ground:1,fresh:1,large:1,small:1,raw:1,organic:1,light:1,dark:1,sweet:1,whole:1,thick:1,thin:1,extra:1,virgin:1};
var STEP_VERBS={salt:1,add:1,cook:1,drop:1,brown:1,toss:1,finish:1,push:1,drain:1,reserve:1,heat:1,steam:1,bring:1,reduce:1,simmer:1,stir:1,mix:1,cut:1,slice:1,chop:1,mince:1,grate:1,grated:1,peel:1,wash:1,preheat:1,boil:1,fry:1,saute:1,sear:1,bake:1,serve:1,season:1,taste:1,adjust:1,pour:1,whisk:1,combine:1,scrape:1,loosen:1,break:1,remove:1,transfer:1,cover:1,flip:1,turn:1,set:1,let:1};
function stepListItem(r,idx){
  var st=(r.steps[idx]||'').toLowerCase();
  var a=getAdj(r.id),scale=a.scale||1;
  for(var i=0;i<r.ingredients.length;i++){
    var ing=r.ingredients[i];
    var name=ing.text.split(',')[0].toLowerCase();
    var words=name.split(/[^a-z]+/).filter(function(w){return w.length>=4&&!MATCH_STOP[w];});
    var hit=words.some(function(w){
      var stem=w.replace(/s$/,'');
      return st.indexOf(w)>=0||(stem.length>=4&&st.indexOf(stem)>=0);
    });
    if(hit){
      return {qty:(ing.qty==null?null:Math.round(ing.qty*scale*100)/100),unit:ing.unit||'',name:ing.text.split(',')[0].trim(),desc:(ing.text.indexOf(',')>=0?ing.text.slice(ing.text.indexOf(',')+1).trim():'')};
    }
  }
  var ws=(r.steps[idx]||'').replace(/[^a-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim().split(' ');
  var j=0;
  while(j<ws.length&&(STEP_VERBS[ws[j].toLowerCase()]||/^(the|a|an|some|your)$/.test(ws[j].toLowerCase())))j++;
  var out=[];
  while(j<ws.length&&out.length<3){
    var w=ws[j].toLowerCase();
    if(/^(the|a|an|some|and|or|of|to|in|on|with|for|into|as|at|then|until|if|when|before|after|from)$/.test(w))break;
    if(out.length>0&&(/ly$/.test(w)||STEP_VERBS[w]))break;
    out.push(ws[j]);j++;
  }
  var phrase=out.join(' ')||(r.steps[idx]||'').split(/[.,;]/)[0].split(/\s+/).slice(0,3).join(' ');
  return {qty:null,unit:'',name:phrase.charAt(0).toUpperCase()+phrase.slice(1),desc:''};
}

var SHOP_UNITS={lb:1,lbs:1,box:1,boxes:1,crown:1,crowns:1,clove:1,cloves:1,tbsp:1,tsp:1,cup:1,cups:1,oz:1,can:1,cans:1,bunch:1,bunches:1,head:1,heads:1,stalk:1,stalks:1,bag:1,bags:1,pack:1,packs:1,slice:1,slices:1,g:1,kg:1,ml:1,l:1,pinch:1,dash:1,egg:1,eggs:1};
function parseQtyStr(s){
  var m=s.match(/^(\d+)\s+(\d)\/(\d)$/);if(m)return +m[1]+(+m[2])/(+m[3]);
  m=s.match(/^(\d+)\/(\d)$/);if(m)return (+m[1])/(+m[2]);
  var f=parseFloat(s);return isNaN(f)?null:f;
}
function parseIngText(text){
  text=(text||'').replace(/\s+/g,' ').trim();
  var m=text.match(/^((?:\d+\s+)?\d+(?:\.\d+)?(?:\/\d+)?)\s+(.+)$/);
  if(m){
    var q=parseQtyStr(m[1]);
    if(q!=null){
      var rest=m[2],sp=rest.indexOf(' ');
      if(sp>0){
        var w=rest.slice(0,sp).toLowerCase().replace(/[.,]$/,'');
        if(SHOP_UNITS[w])return {qty:q,unit:w,name:rest.slice(sp+1)};
      }
      return {qty:q,unit:'',name:rest};
    }
  }
  return {qty:null,unit:'',name:text};
}
function normName(n){
  n=(n||'').toLowerCase().split(',')[0];
  return n.replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
var ABBR_UNITS={tbsp:1,tsp:1,oz:1,g:1,kg:1,ml:1,l:1,lb:1};
function unitKey(u){
  u=(u||'').toLowerCase();
  if(ABBR_UNITS[u])return u;
  if(/(x|ch|sh)es$/.test(u))return u.slice(0,-2);
  return u.replace(/s$/,'');
}
function pluralUnit(u,q){
  if(!u)return '';
  if(ABBR_UNITS[u])return u;
  if(q===1)return unitKey(u);
  if(/s$/.test(u))return u;
  if(/(x|ch|sh)$/.test(u))return u+'es';
  return u+'s';
}
function buildShopRows(){
  var rows={},order=[];
  function rowFor(key,display){
    if(!rows[key]){rows[key]={key:key,name:display||key,parts:[],desc:'',customIds:[],fromRecipe:false,optional:false};order.push(key);}
    return rows[key];
  }
  function addPart(row,p){
    if(p.qty==null)return;
    var uk=unitKey(p.unit),found=null;
    row.parts.forEach(function(pt){if(unitKey(pt.unit)===uk)found=pt;});
    if(found){found.qty=Math.round((found.qty+p.qty)*100)/100;}
    else{row.parts.push({qty:p.qty,unit:p.unit});}
  }
  state.recipes.forEach(function(rid){
    var r=getRecipe(rid);if(!r)return;
    var a=getAdj(rid),scale=a.scale||1;
    r.ingredients.forEach(function(ing,idx){
      var p;
      if(a.edits&&a.edits[idx]!=null){p=parseIngText(a.edits[idx]);}
      else{p={qty:(ing.qty==null?null:Math.round(ing.qty*scale*100)/100),unit:ing.unit||'',name:ing.text};}
      var key=normName(p.name);if(!key)return;
      var row=rowFor(key,p.name.split(',')[0].trim());
      row.fromRecipe=true;
      if(ing.optional)row.optional=true;
      var ci=p.name.indexOf(',');
      if(!row.desc&&ci>=0)row.desc=p.name.slice(ci+1).trim();
      addPart(row,p);
    });
  });
  customState.forEach(function(c){
    var p;
    if(c.name!=null||c.qty!=null){p={qty:(c.qty==null?null:c.qty),unit:c.unit||'',name:c.name||c.text};}
    else{p=parseIngText(c.text);}
    var key=normName(p.name);if(!key)return;
    var row=rowFor(key,p.name.split(',')[0].trim());
    row.customIds.push(c.id);
    addPart(row,p);
  });
  return order.map(function(k){return rows[k];});
}
function fmtShopQty(row){
  return row.parts.map(function(p){return formatQty(p.qty)+(p.unit?' '+pluralUnit(p.unit,p.qty):'');}).join(' + ');
}

      '<div>'+householdRow(r)+'</div>'+
      (getAvg(r.id)?'<div><span class="avgchip">&#9733; '+getAvg(r.id)+'</span></div>':'')+
      '</div></a>';
  });
  h+='<p class="syncstatus" id="syncstatus"></p>';
  return h;
}
function viewRecipe(id){
  var r=getRecipe(id);
  if(!r)return '<a class="back" href="#/">&larr; All recipes</a><div class="empty">Recipe not found.</div>';
  var inList=state.recipes.indexOf(r.id)>=0;
  var a=getAdj(r.id);
  var scale=a.scale||1;
  var editing=editMode===r.id;
  var note=a.note!=null&&a.note!==''?a.note:r.note;

  var h='<a class="back" href="#/">&larr; All recipes</a><div class="card">'+
    '<h2>'+esc(r.name)+'</h2>'+
    '<div class="meta">'+[r.serves?('Serves '+esc(r.serves)):'',esc(r.time||'')].filter(Boolean).join(' &middot; ')+'</div>'+
    '<div>'+tagRow(r)+'</div>'+
    '<div>'+householdRow(r)+'</div>'+
    (r.source?'<div class="meta" style="margin-top:6px"><a href="'+escAttr(r.source)+'" target="_blank" rel="noopener" style="color:#8A3524">Original recipe</a></div>':'')+
    macroRow(r)+
    '<div style="margin-top:14px">'+
      '<button class="btn primary" onclick="sendRecipe(\''+r.id+'\')">Send as text</button>'+
      '<button class="btn" onclick="copyRecipe(\''+r.id+'\')">Copy</button>'+
      '<button class="btn '+(inList?'inlist':'')+'" onclick="toggleShop(\''+r.id+'\')">'+(inList?'&#10003; On shopping list':'+ Shopping list')+'</button>'+
      '<button class="btn" onclick="toggleEditMode(\''+r.id+'\')">'+(editing?'Done editing':'Edit')+'</button>'+
    '</div>';

  // Ingredients header + scaler
  h+='<h3>Ingredients <span class="scaler">'+
    '<button class="step" aria-label="Scale down" onclick="stepScale(\''+r.id+'\',-1)">&minus;</button>'+
    '<button class="cur'+(scale!==1?' on':'')+'" aria-label="Back to 1x" onclick="resetScale(\''+r.id+'\')">'+formatScale(scale)+'x</button>'+
    '<button class="step" aria-label="Scale up" onclick="stepScale(\''+r.id+'\',1)">+</button>'+
    '</span></h3>';

  if(hasAdj(r.id)){
    h+='<div class="tweakbanner">Your tweaks, on this phone only - the master recipe is unchanged. '+
      '<a href="javascript:resetAdj(\''+r.id+'\')">Reset</a></div>'+
      '<div><button class="btn primary" onclick="sendTweak(\''+r.id+'\')">Send this tweak</button></div>';
  }

  h+='<ul style="list-style:none;padding-left:0">';
  r.ingredients.forEach(function(ing,idx){
    var edited=a.edits&&a.edits[idx]!=null;
    if(editing){
      h+='<li><input class="ingedit" value="'+escAttr(dispIng(r,idx))+'" onchange="saveIngEdit(\''+r.id+'\','+idx+',this.value)"></li>';
    }else{
      h+='<li>&bull; '+esc(dispIng(r,idx))+(ing.optional?' <span class="opt">(optional)</span>':'')+(edited?' <span class="edited">(edited)</span>':'')+'</li>';
    }
  });
  h+='</ul>';

  // Steps (cooking mode)
  h+='<h3>Steps</h3><div class="cooklist">'+
    r.steps.map(function(st,idx){
      var done=isStepDone(r.id,idx);
      return '<div class="cookitem'+(done?' done':'')+'" onclick="toggleStep(\''+r.id+'\','+idx+')">'+
        '<input type="checkbox" '+(done?'checked':'')+' tabindex="-1">'+
        '<span class="stepnum">'+(idx+1)+'</span>'+
        '<span class="steptext">'+esc(st)+'</span>'+
        '<button class="steplistbtn" onclick="event.stopPropagation();addStepToList(\''+r.id+'\','+idx+')">+ list</button></div>';
    }).join('')+
    '</div>'+
    '<div style="margin-top:12px"><button class="btn" onclick="resetSteps(\''+r.id+'\')">Reset all steps</button></div>';

  // Note
  if(editing){
    h+='<h3>Tags</h3><div class="tagwrap"><input id="edit-tags" class="ingedit" value="'+escAttr((r.tags||[]).join(', '))+'" autocomplete="off" oninput="tagSuggest(this)" onblur="hideTagSuggest(this)"><div class="tagsuggest" style="display:none"></div></div>'+
      '<div style="margin-top:4px"><button class="btn primary" onclick="saveTags(\''+r.id+'\')">Save tags for everyone</button></div>'+
      '<div class="note"><textarea onchange="saveNoteEdit(\''+r.id+'\',this.value)">'+esc(note||'')+'</textarea></div>';
  }else if(note){
    h+='<div class="note">'+esc(note)+'</div>';
  }

  // Ratings
  var rt=ratingsState[r.id]||{};
  var avg=getAvg(r.id);
  h+='<h3>Family verdicts</h3>';
  HOUSEHOLD.forEach(function(p){
    var cur=rt[p.name]||0;
    h+='<div class="rateperson"><span class="pname">'+esc(p.name)+'</span><span class="stars">'+
      [1,2,3,4,5].map(function(n){return '<button class="'+(n<=cur?'lit':'')+'" onclick="setRating(\''+r.id+'\',\''+p.name+'\','+n+')">&#9733;</button>';}).join('')+
      '</span></div>';
  });
  if(avg){h+='<div style="margin-top:10px"><span class="avgchip">&#9733; '+avg+' household average</span></div><div><button class="btn" onclick="sendRatings(\''+r.id+'\')">Text in verdicts</button></div>';}

  // Comments
  var comments=commentState[r.id]||[];
  h+='<h3>Family notes</h3>';
  if(!comments.length){h+='<p class="sub">Nothing yet - first win, substitution, or kid verdict goes here.</p>';}
  comments.forEach(function(c,idx){
    h+='<div class="comment"><span class="actions"><a href="javascript:sendComment(\''+r.id+'\','+idx+')">text in</a><button onclick="delComment(\''+r.id+'\','+idx+')">&times;</button></span><span class="who">'+esc(c.name)+'</span><br>'+esc(c.text)+'</div>';
  });
  h+='<div class="commentform"><input id="cm-name" placeholder="Name (optional)" maxlength="30"><input id="cm-text" placeholder="Add a note - the kids loved it, used 5 tbsp tamari..." maxlength="500"><button class="btn" onclick="addComment(\''+r.id+'\')">Add note</button></div>';

  h+='<div style="margin-top:22px;padding-top:14px;border-top:1px solid #f0e7db;text-align:center"><button class="btn" style="color:#b03a2e;border-color:#e5b8b2" onclick="deleteRecipe(\''+r.id+'\')">Delete this recipe</button></div>';

  h+='</div>';
  return h;
}
function viewShopping(){
  var h='<a class="back" href="#/">&larr; All recipes</a><h1>Shopping list</h1>';
  var rows=buildShopRows();
  var totalChecked=0;
  if(!rows.length){
    h+='<p class="sub" style="text-align:center;margin:24px 8px 0">Nothing on the list yet - open a recipe and tap "+ Shopping list", or add your own below.</p>';
  }else{
    h+='<div class="card">';
    rows.forEach(function(row){
      var customOnly=!row.fromRecipe,done,cid='cb-row-'+row.key.replace(/[^a-z0-9]+/g,'-');
      if(customOnly){
        done=row.customIds.every(function(id){return customState.some(function(c){return c.id===id&&c.done;});});
      }else{
        done=!!state.checked['row:'+row.key];
      }
      if(done)totalChecked++;
      var qty=fmtShopQty(row);
      var label='<b>'+esc(row.name)+'</b>'+(qty?' - '+esc(qty):'')+(row.desc?(qty?', ':' - ')+esc(row.desc):'')+(row.optional?' <span class="opt">(optional)</span>':'');
      if(customOnly){
        h+='<div class="shopitem'+(done?' done':'')+'"><input type="checkbox" id="'+cid+'" '+(done?'checked':'')+' onchange="toggleCustom(\''+row.customIds[0]+'\')"><label for="'+cid+'">'+label+'</label><button class="delbtn" onclick="delCustom(\''+row.customIds[0]+'\')">&times;</button></div>';
      }else{
        h+='<div class="shopitem'+(done?' done':'')+'"><input type="checkbox" id="'+cid+'" '+(done?'checked':'')+' onchange="toggleItem(\'row:'+row.key+'\')"><label for="'+cid+'">'+label+'</label></div>';
      }
    });
    h+='</div>';
  }
  h+='<div class="card"><div class="customadd"><input id="custom-add" placeholder="Add an item - 2 lb apples, candles..." maxlength="120" onkeydown="if(event.key===\'Enter\')addCustomFromInput()"><button class="btn" onclick="addCustomFromInput()">Add</button></div></div>';
  h+='<div style="margin-top:16px"><button class="btn" onclick="uncheckAll()">Uncheck all ('+totalChecked+'/'+rows.length+')</button><button class="btn" onclick="clearShop()">Clear list</button></div>';
  return h;
}

// ===== Household sync (Supabase) =====
var SUPA_URL='https://jyqnxhpzbgifixkhluvj.supabase.co';
var SUPA_KEY='sb_publishable_y3eGmE7RpMFvFLxu3Syh_w_-AlBvJiB';
var HH_KEY=(location.search.match(/[?&]h=([a-z0-9-]+)/i)||[])[1]||null;
if(!HH_KEY){try{HH_KEY=localStorage.getItem('hm-household');}catch(e){}}
if(HH_KEY){try{localStorage.setItem('hm-household',HH_KEY);}catch(e){}}
var lastRemoteJSON='',pushTimer=null,syncOnline=false,syncTried=false,clientStale=false;
var APP_BUILD=18;
function canon(v){if(Array.isArray(v)){return '['+v.map(canon).join(',')+']';}if(v&&typeof v==='object'){return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';}return JSON.stringify(v);}
function cloudHeaders(){return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};}
function setSyncUI(){
  var el=document.getElementById('syncstatus');if(!el)return;
  if(!HH_KEY){el.textContent='Not connected to the family book - open your family link to sync';el.className='syncstatus';return;}
  if(clientStale){el.textContent='A newer version of the app is out - close this tab and reopen the family link';el.className='syncstatus';return;}
  if(!syncTried){el.textContent='Syncing...';el.className='syncstatus';return;}
  el.textContent=syncOnline?('Synced across the family - '+HH_KEY):'Sync offline - changes stay on this phone';
  el.className='syncstatus'+(syncOnline?' ok':'');
}
var LS_DIRTY='hm-dirty-v1';
var dirtyKeys={},commentRids={};
function loadDirty(){try{var s=JSON.parse(localStorage.getItem(LS_DIRTY));if(s&&s.keys){dirtyKeys=s.keys;commentRids=s.rids||{};}}catch(e){}}
function saveDirty(){try{localStorage.setItem(LS_DIRTY,JSON.stringify({keys:dirtyKeys,rids:commentRids}));}catch(e){}}
function markDirty(k){dirtyKeys[k]=true;saveDirty();}
loadDirty();
function cloudPush(){
  if(!HH_KEY||cloudPush.off||clientStale)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    var keys=Object.keys(dirtyKeys);
    if(!keys.length)return;
    var pushedRids=Object.keys(commentRids),pushedCanon={};
    var blob={recipes:recipesState,ratings:ratingsState,comments:commentState,shop:state,custom:customState};
    var now=new Date().toISOString();
    fetch(SUPA_URL+'/rest/v1/household_state?slug=eq.'+encodeURIComponent(HH_KEY)+'&select=state',{headers:cloudHeaders()})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(rows){
      var remote=(rows&&rows.length&&rows[0].state)||{};
      var merged={};
      Object.keys(remote).forEach(function(k){merged[k]=remote[k];});
      keys.forEach(function(k){
        if(k==='comments'){
          var mc={},rc=remote.comments||{};
          Object.keys(rc).forEach(function(rid){mc[rid]=rc[rid];});
          pushedRids.forEach(function(rid){mc[rid]=commentState[rid]||[];pushedCanon[rid]=canon(mc[rid]);});
          merged.comments=mc;
        }else{
          merged[k]=blob[k];
        }
      });
      merged.v=APP_BUILD;
      return fetch(SUPA_URL+'/rest/v1/household_state',{method:'POST',headers:Object.assign(cloudHeaders(),{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify({slug:HH_KEY,state:merged,updated_at:now})})
      .then(function(r2){
        if(r2.ok){
          keys.forEach(function(k){if(k!=='comments')delete dirtyKeys[k];});
          pushedRids.forEach(function(rid){if(canon(commentState[rid]||[])===pushedCanon[rid])delete commentRids[rid];});
          if(!Object.keys(commentRids).length)delete dirtyKeys['comments'];
          saveDirty();
          lastRemoteJSON=canon(merged);syncOnline=true;
        }else{syncOnline=false;}
        setSyncUI();
      });
    })
    .catch(function(){syncOnline=false;setSyncUI();});
  },400);
}
// Background re-render guard: never wipe user-typed input. Fields get data-dirty on input; while any dirty
// field exists, poll-driven renders are deferred and flush on focusout (or the next poll once fields are saved/cleared).
var pendingRender=false;
function liveInput(){
  var app=document.getElementById('app');if(!app)return false;
  return !!app.querySelector('input[data-dirty],textarea[data-dirty]');
}
function requestRender(){if(liveInput()){pendingRender=true;return;}pendingRender=false;render(true);}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&/^(INPUT|TEXTAREA)$/.test(t.tagName)&&String(t.type).toLowerCase()!=='checkbox'){
    if(t.value&&t.value.trim())t.setAttribute('data-dirty','1');else t.removeAttribute('data-dirty');
  }
});
document.addEventListener('focusout',function(){
  if(pendingRender)setTimeout(function(){if(pendingRender&&!liveInput()){pendingRender=false;render(true);}},80);
});
function cloudPull(seedIfEmpty){
  if(!HH_KEY)return;
  fetch(SUPA_URL+'/rest/v1/household_state?slug=eq.'+encodeURIComponent(HH_KEY)+'&select=state,updated_at',{headers:cloudHeaders()})
  .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(function(rows){
    syncTried=true;syncOnline=true;
    if(!rows||!rows.length){if(seedIfEmpty){['recipes','ratings','comments','shop','custom'].forEach(function(k){dirtyKeys[k]=true;});saveDirty();cloudPush();}setSyncUI();return;}
    var row=rows[0];var rowJSON=canon(row.state||{});
    var remoteV=(row.state&&row.state.v)||0;
    if(remoteV>APP_BUILD){
      clientStale=true;setSyncUI();
      try{if(!sessionStorage.getItem('hm-reload-tried')){sessionStorage.setItem('hm-reload-tried','1');location.reload();}}catch(e){}
      return;
    }
    if(rowJSON!==lastRemoteJSON){
      lastRemoteJSON=rowJSON;var b=row.state||{};
      cloudPush.off=true;
      try{
        if(b.ratings&&!dirtyKeys.ratings){ratingsState=b.ratings;localStorage.setItem(LS_RATINGS,JSON.stringify(ratingsState));}
        if(b.comments&&!dirtyKeys.comments){commentState=b.comments;localStorage.setItem(LS_COMMENTS,JSON.stringify(commentState));}
        if(b.shop&&!dirtyKeys.shop){state=b.shop;localStorage.setItem(LS_KEY,JSON.stringify(state));updateCartBadge();}
        if(b.custom&&!dirtyKeys.custom){customState=b.custom.filter(function(c){return !isStepDump(c);});localStorage.setItem(LS_CUSTOM,JSON.stringify(customState));}
        if(b.recipes&&b.recipes.length&&!dirtyKeys.recipes){recipesState=b.recipes;localStorage.setItem(LS_RECIPES,JSON.stringify(recipesState));}
      }finally{cloudPush.off=false;}
      requestRender();
    }
    setSyncUI();
    if(Object.keys(dirtyKeys).length)cloudPush();
  })
  .catch(function(){syncTried=true;syncOnline=false;setSyncUI();});
}
setInterval(function(){if(!document.hidden)cloudPull(false);},4000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)cloudPull(false);});

// ===== Router =====
function render(keepScroll){
  var y=keepScroll?(window.scrollY||window.pageYOffset||0):0;
  var hash=location.hash||'#/';
  var app=document.getElementById('app');
  if(hash.indexOf('#/recipe/')===0){app.innerHTML=viewRecipe(hash.slice(9));}
  else if(hash==='#/list'){app.innerHTML=viewShopping();}
  else{app.innerHTML=viewList();}
  setSyncUI();
  if(keepScroll){
    window.scrollTo(0,y);
    requestAnimationFrame(function(){window.scrollTo(0,y);});
    setTimeout(function(){window.scrollTo(0,y);},80);
  }
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});
updateCartBadge();
render();
cloudPull(true);
setSyncUI();
</script>
